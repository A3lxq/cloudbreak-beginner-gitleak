server {
    listen 80 default_server;
    root /var/www/html;
    autoindex off;

    # Deliberately no "location ~ /\." deny block -- the whole point of
    # this box is that the deploy pipeline never had one, so /.git/ is
    # directly fetchable like any other file under the docroot.
    location / {
        try_files $uri $uri/ =404;
    }
}
